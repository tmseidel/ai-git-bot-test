<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:fragment="layout(content)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="#{label.app.name}">Task Tracker</title>

  <!-- Theme: apply BEFORE first paint to avoid a flash of the wrong theme.
       The cookie (set by the toggle) wins; without it, follow the system. -->
  <script>
    (function () {
      function savedTheme() {
        var m = document.cookie.match(/(?:^|;\s*)theme=(dark|light)/);
        return m ? m[1] : null;
      }
      function apply(dark) {
        document.documentElement.classList.toggle("dark", dark);
      }
      var saved = savedTheme();
      apply(saved ? saved === "dark"
        : window.matchMedia("(prefers-color-scheme: dark)").matches);
      window.__theme = {
        isDark: function () { return document.documentElement.classList.contains("dark"); },
        set: function (theme) {
          apply(theme === "dark");
          document.cookie = "theme=" + theme + "; path=/; max-age=31536000; SameSite=Lax";
        },
        toggle: function () { this.set(this.isDark() ? "light" : "dark"); }
      };
      // Follow live system changes while the user has not chosen a theme yet.
      window.matchMedia("(prefers-color-scheme: dark)")
        .addEventListener("change", function (e) {
          if (!savedTheme()) apply(e.matches);
        });
    })();
  </script>

  <!-- Tailwind CSS (Play CDN — fine for a small local app) -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- Tailwind v4: class-based dark mode (.dark on <html>, set by the script above) -->
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));
  </style>
  <!-- Toastify for validation / error notifications -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.css">
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

  <script th:fragment="helpers">
    // Toastify notification helpers (shared by all pages).
    function showError(detail) {
      const message = detail && detail.detail ? detail.detail
        : (detail && detail.title ? detail.title : JSON.stringify(detail));
      Toastify({
        text: message,
        duration: 4000,
        close: true,
        gravity: "top",
        position: "right",
        stopOnFocus: true,
        style: { background: "linear-gradient(to right, #ef4444, #dc2626)" }
      }).showToast();
    }
    function showSuccess(message) {
      Toastify({
        text: message,
        duration: 2500,
        close: true,
        gravity: "top",
        position: "right",
        style: { background: "linear-gradient(to right, #22c55e, #16a34a)" }
      }).showToast();
    }
  </script>
  <script th:fragment="theme">
    // Theme switcher: instant toggle + icon that mirrors the active theme.
    (function () {
      function syncIcon() {
        var dark = window.__theme.isDark();
        var sun = document.querySelector(".theme-icon-sun");
        var moon = document.querySelector(".theme-icon-moon");
        if (sun) sun.classList.toggle("hidden", dark);
        if (moon) moon.classList.toggle("hidden", !dark);
      }
      syncIcon();
      var btn = document.getElementById("theme-toggle");
      if (btn) btn.addEventListener("click", function () {
        window.__theme.toggle();
        syncIcon();
      });
    })();
  </script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800
             dark:bg-slate-900 dark:text-slate-200">

  <nav class="bg-white shadow sticky top-0 z-10
              dark:bg-slate-800 dark:shadow-slate-950/50">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/" class="text-xl font-bold text-slate-900 dark:text-white"
         th:text="#{label.app.name}">Task Tracker</a>
      <div class="flex items-center gap-4 text-sm">
        <span class="flex items-center gap-2">
          <span class="text-slate-500 dark:text-slate-400"
                th:text="#{label.nav.switch_lang}">Language</span>
          <a href="/?lang=en"
             class="px-2 py-1 rounded
                    dark:hover:bg-slate-700 dark:hover:text-slate-200"
             th:classappend="${#locale.toString().startsWith('de') ? 'bg-slate-200 font-semibold dark:bg-slate-700 dark:text-slate-100' : 'text-slate-400 hover:text-slate-700'}">EN</a>
          <a href="/?lang=de"
             class="px-2 py-1 rounded
                    dark:hover:bg-slate-700 dark:hover:text-slate-200"
             th:classappend="${#locale.toString().startsWith('de') ? 'text-slate-400 hover:text-slate-700' : 'bg-slate-200 font-semibold dark:bg-slate-700 dark:text-slate-100'}">DE</a>
        </span>
        <button type="button" id="theme-toggle"
                class="px-2 py-1 rounded border border-slate-300
                       text-slate-500 hover:bg-slate-100
                       dark:border-slate-600 dark:text-slate-300
                       dark:hover:bg-slate-700 dark:hover:text-slate-100"
                title="Theme / Thema"
                th:title="#{label.nav.switch_theme}"
                th:aria-label="#{label.nav.switch_theme}">
          <span class="theme-icon-sun hidden" aria-hidden="true">&#9728;</span>
          <span class="theme-icon-moon" aria-hidden="true">&#9790;</span>
          <span class="sr-only" th:text="#{label.nav.switch_theme}">Theme</span>
        </button>
      </div>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto px-4 py-6"
        th:if="${content != null}" th:replace="${content}"></main>

</body>
</html>
