spring:
  application:
    name: task-tracker

  datasource:
    url: jdbc:h2:file:./data/tasktracker;AUTO_SERVER=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  messages:
    basename: messages
    cache-duration: -1    # -1 = never cache (dev hot-reload)
    encoding: UTF-8

server:
  port: 8080
